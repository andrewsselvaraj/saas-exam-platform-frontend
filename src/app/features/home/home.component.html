<div class="home">
  <header class="top-bar">
    <button type="button" class="icon-btn" aria-label="Back" (click)="goBack()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <span class="mode-pill">Bible Mode</span>
  </header>

  <main class="content">
    <section class="hero">
      <div class="hero-icon"><i class="fa-solid fa-cross"></i></div>
      <h1 class="hero-title">Bible Quiz</h1>
      <p class="hero-tagline">Test Your Knowledge. Grow In The Word.</p>
    </section>

    <section class="actions">
      <button type="button" class="btn btn-primary" (click)="startTodaysQuiz()">Start Today's Quiz</button>
      <button type="button" class="btn btn-outline" (click)="exploreQuizzes()">Explore Quiz</button>
    </section>

    <section class="card verse-card">
      <div class="verse-label"><span>✦</span> Verse Of The Day</div>
      <blockquote class="verse-text">"{{ verseOfTheDay.text }}"</blockquote>
      <p class="verse-ref">— {{ verseOfTheDay.reference }}</p>
    </section>

    <section class="card event-card">
      <span class="event-label">Upcoming</span>
      <h3 class="event-title">{{ upcomingEvent.title }}</h3>
      <p class="event-schedule">{{ upcomingEvent.schedule }}</p>
      <button type="button" class="btn btn-small" (click)="viewEvent()">View Event</button>
    </section>

    <section class="quick-links">
      @for (link of quickLinks; track link.label) {
        <button type="button" class="quick-link" (click)="openQuickLink(link)">
          <i class="fa-solid" [class]="link.icon"></i>
          <span>{{ link.label }}</span>
        </button>
      }
    </section>
  </main>

  <nav class="bottom-nav">
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        class="nav-tab"
        [class.active]="activeTab() === tab.id"
        [attr.aria-current]="activeTab() === tab.id ? 'page' : null"
        (click)="selectTab(tab.id)"
      >
        <i class="fa-solid" [class]="tab.icon"></i>
        <span>{{ tab.label }}</span>
      </button>
    }
  </nav>
</div>
